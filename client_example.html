<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bekzod Voice TTS — RunPod Serverless Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #58a6ff; font-size: 20px; }
    label { display: block; margin: 14px 0 6px; font-weight: 500; font-size: 13px; color: #8b949e; }
    input, textarea, select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      color: #f0f6fc;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea { resize: vertical; min-height: 90px; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 13px; color: #8b949e; }
    audio { width: 100%; margin-top: 16px; display: none; }
    pre {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      overflow-x: auto;
      max-height: 150px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ Bekzod Voice TTS (RunPod Serverless)</h2>
  
  <label>RunPod API Key</label>
  <input type="password" id="apiKey" placeholder="rpa_..." />

  <label>Matn (O'zbek tilida)</label>
  <textarea id="text">Assalomu alaykum! Ushbu audio RunPod Serverless GPU orqali generatsiya qilindi.</textarea>

  <div class="row">
    <div class="col">
      <label>Ovoz Profili</label>
      <select id="voice">
        <option value="modern">Modern (Tiniq & Dinamik)</option>
        <option value="classic">Classic (Bariton & Muloyim)</option>
      </select>
    </div>
    <div class="col">
      <label>Tezlik (Speed)</label>
      <select id="speed">
        <option value="0.9">0.9x (Vazmin)</option>
        <option value="1.0" selected>1.0x (Tabiiy)</option>
        <option value="1.1">1.1x (Tezroq)</option>
        <option value="1.2">1.2x (Dinamik)</option>
      </select>
    </div>
  </div>

  <button id="btnGen" onclick="generateTTS()">Ovoz Generatsiya Qilish</button>

  <div id="status" class="status"></div>
  <audio id="player" controls></audio>
  <pre id="debugLog" style="display:none;"></pre>
</div>

<script>
const ENDPOINT_ID = "pz1f73i1e7dd58";

// Load stored API key if exists
document.getElementById("apiKey").value = localStorage.getItem("runpod_api_key") || "";

async function generateTTS() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const text = document.getElementById("text").value.trim();
  const voice = document.getElementById("voice").value;
  const speed = parseFloat(document.getElementById("speed").value);
  const btn = document.getElementById("btnGen");
  const status = document.getElementById("status");
  const player = document.getElementById("player");
  const debugLog = document.getElementById("debugLog");

  if (!apiKey) {
    alert("Iltimos, RunPod API Key kiriting!");
    return;
  }
  if (!text) {
    alert("Matn bo'sh bo'lmasin!");
    return;
  }

  localStorage.setItem("runpod_api_key", apiKey);
  btn.disabled = true;
  status.textContent = "⏳ Serverless workerga so'rov yuborilmoqda (cold start bo'lsa ~20s, warm bo'lsa ~2s)...";
  player.style.display = "none";
  debugLog.style.display = "none";

  const startTime = Date.now();

  try {
    const res = await fetch(`https://api.runpod.ai/v2/${ENDPOINT_ID}/runsync`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        input: {
          text: text,
          voice: voice,
          speed: speed,
          format: "mp3"
        }
      })
    });

    const data = await res.json();
    const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(2);

    if (data.status === "COMPLETED" && data.output && data.output.audio_base64) {
      status.textContent = `✅ Tayyor! (${elapsedSec}s da bajarildi, Audio: ${data.output.duration}s)`;
      player.src = `data:audio/mp3;base64,${data.output.audio_base64}`;
      player.style.display = "block";
      player.play();
    } else {
      status.textContent = `❌ Xatolik yuz berdi: ${JSON.stringify(data.error || data)}`;
      debugLog.style.display = "block";
      debugLog.textContent = JSON.stringify(data, null, 2);
    }
  } catch (err) {
    status.textContent = `❌ So'rovda tarmoq xatosi: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
